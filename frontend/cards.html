<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мои карты | Оплата</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <button class="back-btn" onclick="window.location.href='index.html'" title="На главную">←</button>
        <h1>Мои карты</h1>
        <!-- КНОПКА ВЫХОДА -->
        <button class="logout-btn" onclick="window.logout()" title="Выйти из аккаунта">
          Выйти
        </button>
      </div>
      <p class="header-subtitle">Управление привязанными картами</p>
    </header>

    <!-- Статистика (вставится сюда динамически) -->
    <div id="paymentStats"></div>

    <!-- Cards List -->
    <div id="cardsList" class="cards-list">
      <div class="loading">Загрузка...</div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">💳</div>
      <h3>Нет привязанных карт</h3>
      <p>Привяжите карту для быстрых платежей</p>
      <button class="btn btn-primary" onclick="window.location.href='index.html'">
        Привязать карту
      </button>
    </div>

    <!-- История платежей -->
    <div id="paymentHistory" style="margin-top:30px; padding:20px;">
      <h3 style="margin-bottom:15px;">История платежей</h3>
      <p style="text-align:center; color:#888;">Загрузка...</p>
    </div>

    <!-- Footer -->
    <div class="footer-links">
      <a href="index.html">Новая привязка</a>
      <a href="#">Помощь</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/cards.js"></script>
</body>

</html>
