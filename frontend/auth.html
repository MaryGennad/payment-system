<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация | Оплата</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:,">
  <style>
    /* Специфичные стили только для страницы авторизации */
    .auth-wrapper {
      max-width: 440px;
      margin: 80px auto;
      animation: fadeInUp 0.8s var(--ease-premium) forwards;
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .auth-header h2 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
    }
    
    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    
    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s var(--ease-premium);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    
    .tab-btn:hover {
      color: var(--text-primary);
    }
    
    .tab-btn.active {
      background: var(--text-primary);
      color: white;
    }
    
    .form-container { display: none; }
    .form-container.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="auth-wrapper">
      
      <!-- Заголовок -->
      <div class="auth-header">
        <h2>Добро пожаловать</h2>
        <p>Войдите или создайте аккаунт</p>
      </div>

      <!-- Вкладки -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>

      <!-- Форма ВХОДА -->
      <form id="loginForm" class="form-container active">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary">
          Войти
        </button>
      </form>

      <!-- Форма РЕГИСТРАЦИИ -->
      <form id="registerForm" class="form-container">
        <div class="form-group">
          <label for="registerName">Имя</label>
          <input type="text" id="registerName" placeholder="Ваше имя" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="name@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="registerPassword">Пароль</label>
          <input type="password" id="registerPassword" placeholder="Минимум 6 символов" required autocomplete="new-password">
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary">
          Зарегистрироваться
        </button>
      </form>

    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
