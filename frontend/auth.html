<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация | Оплата</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:,">
  <style>
    /* Стили для вкладок */
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      background: #1e293b;
      padding: 5px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .tab-btn:hover { color: white; }
    .tab-btn.active {
      background: #8b5cf6;
      color: white;
    }
    .form-container { display: none; }
    .form-container.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 400px; margin: 50px auto; padding: 30px;">
      <div class="card-header" style="text-align: center; margin-bottom: 30px; border: none; padding: 0;">
        <h2 style="color: white; margin: 0;">Добро пожаловать</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">Войдите или создайте аккаунт</p>
      </div>

      <!-- Вкладки -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>

      <!-- Форма ВХОДА (теперь это настоящий тег <form>) -->
      <form id="loginForm" class="form-container active">
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Email</label>
          <input type="email" id="loginEmail" placeholder="example@mail.ru" required
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Пароль</label>
          <input type="password" id="loginPassword" placeholder="••••••" required
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <!-- ВАЖНО: type="submit" и НИКАКОГО onclick -->
        <button type="submit" id="loginBtn"
                style="width: 100%; padding: 12px; background: #8b5cf6; border: none; 
                       border-radius: 8px; color: white; font-size: 14px; font-weight: 600; 
                       cursor: pointer; transition: background 0.3s;">
          Войти
        </button>
      </form>

      <!-- Форма РЕГИСТРАЦИИ (теперь это настоящий тег <form>) -->
      <form id="registerForm" class="form-container">
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Имя</label>
          <input type="text" id="registerName" placeholder="Ваше имя" required
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Email</label>
          <input type="email" id="registerEmail" placeholder="example@mail.ru" required
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Пароль (мин. 6 символов)</label>
          <input type="password" id="registerPassword" placeholder="••••••" required
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <!-- ВАЖНО: type="submit" и НИКАКОГО onclick -->
        <button type="submit" id="registerBtn"
                style="width: 100%; padding: 12px; background: #8b5cf6; border: none; 
                       border-radius: 8px; color: white; font-size: 14px; font-weight: 600; 
                       cursor: pointer; transition: background 0.3s;">
          Зарегистрироваться
        </button>
      </form>

    </div>
  </div>

  <!-- Подключаем ВНЕШНИЙ скрипт, который содержит всю логику (без встроенных скриптов!) -->
  <script src="/js/auth.js"></script>
</body>
</html>
