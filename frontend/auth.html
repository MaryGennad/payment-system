<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация | Оплата</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:,">
  <style>
    /* Стили для вкладок */
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      background: #1e293b;
      padding: 5px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .tab-btn:hover { color: white; }
    .tab-btn.active {
      background: #8b5cf6;
      color: white;
    }
    .form-container { display: none; }
    .form-container.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 400px; margin: 50px auto; padding: 30px;">
      <div class="card-header" style="text-align: center; margin-bottom: 30px; border: none; padding: 0;">
        <h2 style="color: white; margin: 0;">Добро пожаловать</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">Войдите или создайте аккаунт</p>
      </div>

      <!-- Вкладки -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>

      <!-- Форма ВХОДА -->
      <div id="loginForm" class="form-container active">
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Email</label>
          <input type="email" id="loginEmail" placeholder="example@mail.ru" 
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Пароль</label>
          <input type="password" id="loginPassword" placeholder="••••••" 
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <button type="button" id="loginBtn" onclick="handleLogin()" 
                style="width: 100%; padding: 12px; background: #8b5cf6; border: none; 
                       border-radius: 8px; color: white; font-size: 14px; font-weight: 600; 
                       cursor: pointer; transition: background 0.3s;">
          Войти
        </button>
      </div>

      <!-- Форма РЕГИСТРАЦИИ -->
      <div id="registerForm" class="form-container">
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Имя</label>
          <input type="text" id="registerName" placeholder="Ваше имя" 
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Email</label>
          <input type="email" id="registerEmail" placeholder="example@mail.ru" 
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label style="color: #94a3b8; font-size: 13px; margin-bottom: 8px; display: block;">Пароль (мин. 6 символов)</label>
          <input type="password" id="registerPassword" placeholder="••••••" 
                 style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; 
                        border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;">
        </div>
        <button type="button" id="registerBtn" onclick="handleRegister()" 
                style="width: 100%; padding: 12px; background: #8b5cf6; border: none; 
                       border-radius: 8px; color: white; font-size: 14px; font-weight: 600; 
                       cursor: pointer; transition: background 0.3s;">
          Зарегистрироваться
        </button>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = '/api';

    // 1. ПРОВЕРКА АВТОРИЗАЦИИ ПРИ ЗАГРУЗКЕ
    // Если уже есть токен, сразу кидаем в КАТАЛОГ УСЛУГ
    if (localStorage.getItem('token')) {
      window.location.href = 'services.html';
    }

    // 2. Переключение вкладок
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
        
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById(tab + 'Form').classList.add('active');
      });
    });

    // 3. Функция ВХОДА
    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        alert('Введите email и пароль');
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Вход...';

        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Ошибка входа');
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // 🎯 ИЗМЕНЕНО: Переходим в каталог услуг
        window.location.href = 'services.html';
        
      } catch (err) {
        alert('❌ ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    }

    // 4. Функция РЕГИСТРАЦИИ
    async function handleRegister() {
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const btn = document.getElementById('registerBtn');
      
      if (!name || !email || !password) {
        alert('Заполните все поля');
        return;
      }
      if (password.length < 6) {
        alert('Пароль должен быть не менее 6 символов');
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Регистрация...';

        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Ошибка регистрации');
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // 🎯 ИЗМЕНЕНО: Переходим в каталог услуг
        window.location.href = 'services.html';
        
      } catch (err) {
        alert('❌ ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Зарегистрироваться';
      }
    }
  </script>
</body>
</html>
