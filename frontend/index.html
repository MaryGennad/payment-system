<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Привязка карты | Оплата</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <button class="back-btn" onclick="history.back()">←</button>
        <h1>Привязка карты</h1>
        <div class="header-spacer"></div>
      </div>
      <p class="header-subtitle">Безопасно для будущих платежей</p>
    </header>

    <!-- Alerts -->
    <div id="alertContainer"></div>

    <!-- Main Card -->
    <div class="card">
      <div class="card-header">
        <h2>Способ оплаты</h2>
        <div class="secure-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Защищено
        </div>
      </div>

      <div class="card-body">
        <!-- Summary -->
        <div class="summary">
          <div class="summary-row">
            <span>Услуга</span>
            <span>Привязка карты</span>
          </div>
          <div class="summary-row">
            <span>Комиссия</span>
            <span>0 ₽</span>
          </div>
          <div class="summary-row total">
            <span>ИТОГО</span>
            <span>1.00 ₽</span>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">📧 Email для чека</label>
          <input type="email" id="email" placeholder="example@mail.ru" required>
          <div class="error-text">Введите корректный email</div>
        </div>

        <!-- Payment Methods -->
        <div class="payment-methods">
          <div class="payment-method active" data-provider="yookassa">
            <div class="pm-icon"><span class="pm-logo">ЮKassa</span></div>
            <div class="pm-info">
              <div class="pm-name">ЮKassa</div>
              <div class="pm-desc">Карта, СБП, кошельки</div>
            </div>
            <div class="pm-check"></div>
          </div>
          <div class="payment-method" data-provider="robokassa">
            <div class="pm-icon"><span class="pm-logo">Robokassa</span></div>
            <div class="pm-info">
              <div class="pm-name">Robokassa</div>
              <div class="pm-desc">Карта, СБП, Альфа Pay</div>
            </div>
            <div class="pm-check"></div>
          </div>
        </div>

        <!-- Consents (152-ФЗ) -->
        <div class="consent-group">
          <label class="consent-item">
            <input type="checkbox" id="consent152" required>
            <span>Согласие на обработку персональных данных (152-ФЗ)</span>
          </label>
          <label class="consent-item">
            <input type="checkbox" id="consentOffer" required>
            <span>Согласен с <a href="#" target="_blank">офертой</a></span>
          </label>
          <label class="consent-item">
            <input type="checkbox" id="consentSave" required>
            <span>Разрешаю сохранить карту для будущих платежей</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button class="btn btn-primary" id="btnSubmit" disabled>
          Продолжить
        </button>

        <!-- Card Logos -->
        <div class="card-logos">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logotipo_Mir_%282021%29.svg/100px-Logotipo_Mir_%282021%29.svg.png" alt="MIR">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/100px-Mastercard-logo.svg.png" alt="Mastercard">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/100px-Visa_Inc._logo.svg.png" alt="Visa">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-links">
      <a href="cards.html">Мои карты</a>
      <a href="#">Помощь</a>
    </div>
  </div>

 <script src="/js/auth.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
